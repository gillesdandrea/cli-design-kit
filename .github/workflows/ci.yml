name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install root deps
        run: bun install
      - name: Typecheck recipes.md
        run: bun run recipes-check
      - name: Verifier tests
        working-directory: tools/design-cli-verify
        run: |
          bun install
          bun test
